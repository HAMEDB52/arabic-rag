[project]
name = "arabic-rag"
version = "0.1.0"
description = "نظام RAG للمستندات العربية مع استشهادات مرجعية قابلة للتحقق وتقييم دقة"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "pdfplumber>=0.11"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
arabic-rag = "arabic_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
